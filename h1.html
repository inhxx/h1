<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H1目标完成度看板 </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .fade-in { animation: fadeIn 0.6s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- 头部 -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">📊 H1目标完成度看板</h1>
            <p class="text-gray-600">Week <span id="weekNum" class="font-bold text-blue-600">--</span> 数据更新于 <span id="updateDate" class="font-bold">--</span></p>
            <div class="mt-4 text-sm text-gray-500">
                <span class="inline-block w-3 h-3 bg-green-500 rounded-full mr-1"></span>优秀(≥120%)
                <span class="inline-block w-3 h-3 bg-yellow-500 rounded-full mx-1"></span>良好(100-120%)
                <span class="inline-block w-3 h-3 bg-red-500 rounded-full mx-1"></span>需关注(&lt;90%)
            </div>
        </div>

        <!-- 总体概览 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-gradient-to-br from-blue-500 to-blue-700 rounded-2xl p-6 text-white card-hover">
                <div class="text-3xl font-bold" id="avgCompletion">--%</div>
                <div class="text-sm opacity-80">平均完成度</div>
            </div>
            <div class="bg-gradient-to-br from-green-500 to-green-700 rounded-2xl p-6 text-white card-hover">
                <div class="text-3xl font-bold" id="topPerformer">--</div>
                <div class="text-sm opacity-80">最佳表现</div>
            </div>
            <div class="bg-gradient-to-br from-orange-500 to-red-600 rounded-2xl p-6 text-white card-hover">
                <div class="text-3xl font-bold" id="needAttention">--人</div>
                <div class="text-sm opacity-80">需关注(&lt;70%)</div>
            </div>
            <div class="bg-gradient-to-br from-purple-500 to-purple-700 rounded-2xl p-6 text-white card-hover">
                <div class="text-3xl font-bold" id="totalPeople">10人</div>
                <div class="text-sm opacity-80">总人数</div>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <div class="bg-white rounded-2xl shadow-lg p-6">
                <h3 class="text-xl font-bold text-gray-800 mb-4">🏆 个人完成度排名</h3>
                <canvas id="rankingChart"></canvas>
            </div>
            <div class="bg-white rounded-2xl shadow-lg p-6">
                <h3 class="text-xl font-bold text-gray-800 mb-4">📈 分类完成情况</h3>
                <canvas id="categoryChart"></canvas>
            </div>
        </div>

        <!-- 详细数据表格 -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
            <h3 class="text-xl font-bold text-gray-800 mb-4">📋 详细完成情况（只读）</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-gray-600 font-semibold">排名</th>
                            <th class="px-4 py-3 text-gray-600 font-semibold">姓名</th>
                            <th class="px-4 py-3 text-gray-600 font-semibold">类型</th>
                            <th class="px-4 py-3 text-gray-600 font-semibold">目标/渠道</th>
                            <th class="px-4 py-3 text-gray-600 font-semibold text-right">目标值</th>
                            <th class="px-4 py-3 text-gray-600 font-semibold text-right">实际完成</th>
                            <th class="px-4 py-3 text-gray-600 font-semibold">完成度</th>
                            <th class="px-4 py-3 text-gray-600 font-semibold">状态</th>
                        </tr>
                    </thead>
                    <tbody id="detailTable"></tbody>
                </table>
            </div>
        </div>

        <!-- 管理员提示 -->
        <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-center text-sm text-blue-700">
            <p>💡 此页面为<strong>只读展示</strong>，如需更新数据请联系管理员</p>
            <p class="mt-1 text-xs text-blue-500">数据每周一更新 | 当前为 Week <span id="weekNum2">--</span> 数据</p>
        </div>
    </div>

    <script>
        // 从JSON文件加载数据
        async function loadData() {
            try {
                const response = await fetch('data.json?v=' + Date.now()); // 加时间戳防止缓存
                const data = await response.json();
                
                document.getElementById('weekNum').textContent = data.week;
                document.getElementById('weekNum2').textContent = data.week;
                document.getElementById('updateDate').textContent = data.date;
                
                updateDashboard(data.data);
            } catch (error) {
                console.error('加载数据失败:', error);
                document.getElementById('detailTable').innerHTML = 
                    '<tr><td colspan="8" class="px-4 py-8 text-center text-red-500">数据加载失败，请检查 data.json 文件是否存在</td></tr>';
            }
        }

        function updateDashboard(peopleData) {
            // 按完成度排序
            const sortedData = peopleData.sort((a, b) => b.completion - a.completion);
            
            // 更新概览卡片
            const avg = sortedData.reduce((sum, p) => sum + p.completion, 0) / sortedData.length;
            document.getElementById('avgCompletion').textContent = avg.toFixed(1) + '%';
            document.getElementById('topPerformer').textContent = sortedData[0]?.name || '-';
            document.getElementById('needAttention').textContent = sortedData.filter(p => p.completion < 70).length + '人';

            // 更新图表
            updateCharts(sortedData);
            
            // 更新表格
            updateTable(sortedData);
        }

        function updateCharts(data) {
            // 排名图
            const ctx1 = document.getElementById('rankingChart').getContext('2d');
            new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: data.map(p => p.name),
                    datasets: [{
                        label: '完成度(%)',
                        data: data.map(p => p.completion.toFixed(1)),
                        backgroundColor: data.map(p => 
                            p.completion >= 90 ? '#10b981' :
                            p.completion >= 70 ? '#f59e0b' : '#ef4444'
                        ),
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true, max: 150 } },
                    plugins: { legend: { display: false } }
                }
            });

            // 分类图
            const categories = {};
            data.forEach(p => {
                if (!categories[p.type]) categories[p.type] = { sum: 0, count: 0 };
                categories[p.type].sum += p.completion;
                categories[p.type].count++;
            });
            
            const ctx2 = document.getElementById('categoryChart').getContext('2d');
            new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(categories),
                    datasets: [{
                        data: Object.values(categories).map(c => (c.sum / c.count).toFixed(1)),
                        backgroundColor: ['#667eea', '#10b981', '#f59e0b', '#3b82f6']
                    }]
                },
                options: { responsive: true }
            });
        }

        function updateTable(data) {
            const tbody = document.getElementById('detailTable');
            let html = '';
            let rank = 1;
            
            data.forEach((person, pIdx) => {
                person.targets.forEach((target, tIdx) => {
                    const isFirst = tIdx === 0;
                    const medal = rank <= 3 ? ['🥇','🥈','🥉'][rank-1] : rank;
                    const statusClass = person.completion >= 90 ? 'bg-green-100 text-green-700' : 
                                       person.completion >= 70 ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700';
                    const statusText = person.completion >= 90 ? '优秀' : person.completion >= 70 ? '良好' : '需关注';
                    
                    html += `
                        <tr class="border-b hover:bg-gray-50 fade-in ${!isFirst ? 'border-t border-dashed' : ''}">
                            ${isFirst ? `<td class="px-4 py-3 font-bold text-lg" rowspan="${person.targets.length}">${medal}</td>` : ''}
                            ${isFirst ? `<td class="px-4 py-3 font-semibold text-lg" rowspan="${person.targets.length}">${person.name}</td>` : ''}
                            ${isFirst ? `<td class="px-4 py-3" rowspan="${person.targets.length}"><span class="px-2 py-1 rounded text-sm ${person.type === '私域' ? 'bg-pink-100 text-pink-700' : person.type === '公域' ? 'bg-blue-100 text-blue-700' : person.type === '转化运营' ? 'bg-purple-100 text-purple-700' : 'bg-green-100 text-green-700'}">${person.type}</span></td>` : ''}
                            <td class="px-4 py-3 text-gray-700">${target.name}</td>
                            <td class="px-4 py-3 text-right font-mono text-gray-600">${target.target.toLocaleString()}</td>
                            <td class="px-4 py-3 text-right font-mono font-semibold ${target.actual >= target.target ? 'text-green-600' : 'text-gray-700'}">${target.actual.toLocaleString()}</td>
                            ${isFirst ? `<td class="px-4 py-3" rowspan="${person.targets.length}"><div class="flex items-center"><div class="w-20 bg-gray-200 rounded-full h-2 mr-2"><div class="h-2 rounded-full ${person.completion >= 90 ? 'bg-green-500' : person.completion >= 70 ? 'bg-yellow-500' : 'bg-red-500'}" style="width: ${Math.min(person.completion, 100)}%"></div></div><span class="font-bold ${person.completion >= 90 ? 'text-green-600' : person.completion >= 70 ? 'text-yellow-600' : 'text-red-600'}">${person.completion.toFixed(1)}%</span></div></td>` : ''}
                            ${isFirst ? `<td class="px-4 py-3" rowspan="${person.targets.length}"><span class="px-3 py-1 rounded-full text-sm font-medium ${statusClass}">${statusText}</span></td>` : ''}
                        </tr>
                    `;
                });
                rank++;
            });
            
            tbody.innerHTML = html;
        }

        // 页面加载时自动获取数据
        window.onload = loadData;
    </script>
</body>
</html>
